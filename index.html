<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2362257A'/><stop offset='1' stop-color='%23115E96'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='23' text-anchor='middle' font-size='20' font-family='sans-serif' font-weight='700' fill='%23ffffff'>h</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scadahub — Escala de Almoço & Atendimento</title>
    <meta name="description" content="Sistema de gestão de rodízio de almoço da scadahub com garantia de cobertura de atendimento contínuo aos clientes." />
    
    <!-- Controle de Cache para GitHub Pages (Garante carregamento imediato de novas versões) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Cabeçalhos de Segurança para Navegadores Modernos e GitHub Pages -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.firebaseio.com https://apis.google.com; frame-src https://*.firebaseio.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseapp.com; img-src 'self' data: https:; frame-ancestors 'none';" />

    <!-- Proteção contra Clickjacking (Frame-Busting) -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length <= 1) {
          console.error('Global Error Captured:', e);
        }
      });
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #08060c; color: #f8f5fa; font-family: 'Wix Madefor Text', system-ui, sans-serif;">
        <div style="display: flex; align-items: baseline; font-family: 'Quicksand', 'Wix Madefor Display', system-ui, sans-serif; font-size: 2.25rem; letter-spacing: -0.03em; line-height: 1; margin-bottom: 16px;">
          <span style="color: #b47ad6; font-weight: 400;">scada</span><span style="font-weight: 700; background: linear-gradient(90deg, #62257A, #3B3F8A 55%, #115E96); -webkit-background-clip: text; background-clip: text; color: transparent;">hub</span>
        </div>
        <div style="font-size: 0.9rem; color: #B9B1C4; font-weight: 500;">
          Carregando a escala de almoço…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
