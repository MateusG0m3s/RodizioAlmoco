<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='22' font-family='sans-serif' font-weight='800' fill='%232D0C5E'>s<tspan fill='%230284c7'>h</tspan></text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scadahub — Escala de Almoço & Atendimento</title>
    <meta name="description" content="Sistema de gestão de rodízio de almoço da scadahub com garantia de cobertura de atendimento contínuo aos clientes." />
    
    <!-- Controle de Cache para GitHub Pages (Garante carregamento imediato de novas versões) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Cabeçalhos de Segurança para Navegadores Modernos e GitHub Pages -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseapp.com; img-src 'self' data: https:; frame-ancestors 'none';" />

    <!-- Proteção contra Clickjacking (Frame-Busting) -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length <= 1) {
          console.error('Global Error Captured:', e);
        }
      });
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0817; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="display: flex; align-items: baseline; font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 16px;">
          <span style="color: #ffffff;">scada</span><span style="color: #38bdf8;">hub</span>
        </div>
        <div style="font-size: 0.9rem; color: #94a3b8; font-weight: 500;">
          Carregando Escala de Almoço...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
